# Netlify build settings. Response headers live in public/_headers.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 requires Node 20.3 or newer.
  NODE_VERSION = "22"

# Deploy previews get the same headers as production but must not be indexed.
[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex"
