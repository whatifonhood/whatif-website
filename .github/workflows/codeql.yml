name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'

permissions: {}

jobs:
  analyze:
    name: Static analysis
    # Code scanning is a public-repository feature on this plan. While the repo is
    # private the upload is refused, so the job is skipped rather than red; the
    # moment the repo goes public it runs on every push.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The upload step reads its own workflow run; on a private repository that
      # call is denied without this and the job fails after a clean analysis.
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939 # v4
