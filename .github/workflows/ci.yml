name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

# Third-party actions are pinned by commit SHA, not by tag.
#
# A tag is a mutable pointer. Whoever controls the action's repository can move
# `v4` to any commit they like, and every workflow that trusts the tag runs the
# new code on its next build — which is precisely how the tj-actions compromise
# reached thousands of repositories in 2025. A SHA cannot be moved. The comment
# after each one records which release it was, so upgrading stays a deliberate
# edit rather than something that happens to us.

jobs:
  check:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what the lockfile says, and nothing else.
      - run: npm ci

      # The job is called "Typecheck, lint and build" and did not typecheck.
      # astro check is what catches a broken content contract or a bad prop
      # before it reaches a page.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

  test:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Both, because playwright.config.ts runs two projects: desktop is
      # Chromium and mobile is iPhone 13, which is WebKit. Installing only
      # chromium made every mobile test fail to launch — so this job was red on
      # every push and half the suite had never actually run here.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependencies and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Fail on anything a real attacker could use. Low-severity advisories in
      # build-only tooling do not block a deploy of a static site.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # The site is built to have no secrets; this makes sure it stays that way.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
