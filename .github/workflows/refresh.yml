name: Refresh data

# Freshness on this site comes from rebuilding, not from a live script — that is
# the deliberate design. But nothing rebuilt unless somebody pushed, so the
# snapshot figures, the burn list and the tweet wall all decayed together and
# the site quietly became less true over time.
#
# This runs the data tools, commits whatever actually changed, and lets the push
# trigger the deploy. If an upstream returns nothing it fails loudly rather than
# committing an empty file over good data.

on:
  schedule:
    # 05:12 UTC daily. Off the hour on purpose: every free API is busiest when
    # thousands of cron jobs fire at :00.
    - cron: '12 5 * * *'
  workflow_dispatch:

# Nothing at the workflow level; the one job that pushes asks for what it needs.
permissions: {}

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh on-chain and market data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # persist-credentials: false keeps the write token out of .git/config for
      # the whole run — the npm install and every third-party fetch below happen
      # without a push-capable credential on disk. The commit step re-attaches
      # it for the one command that needs it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Each of these writes a committed file. They are separate steps so a
      # failure names the source that broke rather than "the refresh failed".
      - name: Snapshot price, supply and burn
        run: npm run snapshot

      - name: Burn history from the chain
        run: npm run burns

      - name: Largest holders from the explorer
        # Best-effort: the explorer sits behind a challenge and can refuse. A
        # day-old holder list is fine; failing the whole refresh over it is not.
        continue-on-error: true
        run: npm run holders

      - name: Community wall
        run: npm run tweets

      # The chart's floor. GeckoTerminal refuses most browser requests and its
      # 429 has no CORS header, so the page cannot fetch these reliably at all —
      # they ship with the site instead.
      - name: Chart candles
        run: npm run candles

      # A tool that returned nothing would otherwise commit an empty file over
      # good data, which is worse than being a day stale.
      - name: Refuse to commit empty data
        run: |
          set -e
          test -s src/config/burns.ts
          test -s src/config/tweet-cards.ts
          test -s src/config/holders.ts
          test -s src/data/candles.json
          node -e "
            const { BURNS } = await import('./src/config/burns.ts');
            if (BURNS.length === 0) { console.error('burns.ts came back empty'); process.exit(1); }
            const { HOLDERS } = await import('./src/config/holders.ts');
            if (HOLDERS.length === 0) { console.error('holders.ts came back empty'); process.exit(1); }
            const { TOKEN_SNAPSHOT } = await import('./src/config/site.ts');
            for (const [key, value] of Object.entries(TOKEN_SNAPSHOT)) {
              if (typeof value === 'number' && !(Number.isFinite(value) && value >= 0)) { console.error(`site.ts snapshot ${key} is ${value}`); process.exit(1); }
            }
            // 'test -s' passes on a file holding an empty array, because the
            // header and the type are still in it.
            const candles = JSON.parse(await import('node:fs').then((fs) => fs.readFileSync('./src/data/candles.json', 'utf8')));
            for (const [frame, rows] of Object.entries(candles)) {
              if (!Array.isArray(rows) || rows.length < 2) {
                console.error(`candles.json has no ${frame} candles`); process.exit(1);
              }
            }
            const { TWEET_URLS } = await import('./src/config/tweets.ts');
            const { TWEET_CARDS } = await import('./src/config/tweet-cards.ts');
            if (TWEET_URLS.length > 0 && TWEET_CARDS.length === 0) {
              console.error('tweet-cards.ts came back empty'); process.exit(1);
            }
          "

      - name: Verify the site still builds
        run: npm run build

      # A refresh commit pushed with GITHUB_TOKEN never triggers ci.yml, so the
      # checks that guard the data files have to run here, before the commit —
      # the header contract, and the wall's posts matching the list.
      - name: Check the data the way CI would
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/headers.spec.ts --project=desktop
          npx playwright test tests/smoke.spec.ts --project=desktop -g "wall of posts"

      - name: Commit anything that changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add src/config/site.ts src/config/burns.ts src/config/tweet-cards.ts \
                  src/config/holders.ts src/data/candles.json
          if git diff --cached --quiet; then
            echo 'Nothing changed today.'
          else
            git commit -m 'Refresh on-chain and market data'
            # main may have moved during the twenty minutes above.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
