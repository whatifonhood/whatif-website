<!doctype html>
<!--
  Source for the per-meme sharing cards (public/memes/og/<slug>.jpg).

  Rendered by `npm run cards`, which passes the meme in the query string:
    card-meme.html?slug=gm-coffee-first&title=Coffee%20first&series=gm

  The artwork is CONTAINED, never cropped — a meme's joke is usually the whole
  frame, and a centre-crop cuts the punchline off.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Archivo';
        font-style: italic;
        font-weight: 900;
        src: url('../node_modules/@fontsource/archivo/files/archivo-latin-900-italic.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-weight: 700;
        src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-700-normal.woff2')
          format('woff2');
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #080b07;
        position: relative;
        font-family: 'Archivo', sans-serif;
      }
      .glow {
        position: absolute;
        left: -180px;
        top: 50%;
        width: 900px;
        height: 900px;
        transform: translateY(-50%);
        background: radial-gradient(circle, rgba(143, 206, 2, 0.22), rgba(8, 11, 7, 0) 65%);
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(34, 48, 18, 0.55) 1px, transparent 1px),
          linear-gradient(90deg, rgba(34, 48, 18, 0.55) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: linear-gradient(90deg, #000 0%, transparent 62%);
      }
      .row {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        gap: 44px;
        padding: 46px 46px 46px 72px;
      }
      .text {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .kicker {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-size: 18px;
        color: #8fce02;
      }
      h1 {
        font-style: italic;
        font-weight: 900;
        font-size: 62px;
        line-height: 0.94;
        letter-spacing: -0.025em;
        text-transform: uppercase;
        color: #ffffff;
        /* Long titles step down rather than overflow the card. */
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
      }
      .foot {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 17px;
        color: #9aa889;
      }
      .foot b {
        color: #8fce02;
        font-weight: 700;
      }
      .frame {
        width: 538px;
        height: 538px;
        flex: none;
        border: 1px solid #223012;
        border-radius: 18px;
        background: #10160a;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .frame img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="row">
      <div class="text">
        <p class="kicker" id="kicker">The vault</p>
        <h1 id="title">Meme</h1>
        <p class="foot"><b>whatifonhood.com</b> — free to steal</p>
      </div>
      <div class="frame"><img id="art" alt="" /></div>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const title = params.get('title') ?? 'Meme';
      document.getElementById('title').textContent = title;
      document.getElementById('kicker').textContent = params.get('series') ?? 'The vault';
      document.getElementById('art').src = `../public/memes/full/${params.get('slug')}.webp`;

      // Step the title down until it fits the four lines the layout allows.
      const heading = document.getElementById('title');
      for (let size = 62; size > 30 && heading.scrollHeight > heading.clientHeight + 2; size -= 2) {
        heading.style.fontSize = `${size}px`;
      }
    </script>
  </body>
</html>
